<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSAF Student Fee Management</title>
    
    <!-- TAILWIND CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- REACT & REACT DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- BABEL (To compile JSX in browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        /* FIX: Force the CLASSIC JSX runtime.
           Newer @babel/standalone defaults to the "automatic" runtime, which
           emits `import { jsx } from "react/jsx-runtime"`. That import is illegal
           inside a non-module text/babel script (React is a UMD global here),
           which caused the white screen. Classic runtime uses React.createElement. */
        Babel.registerPreset('react-classic', {
            presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]]
        });
    </script>

    <!-- FONT & ICONS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- XLSX LIBRARY FOR MULTI-SHEET BACKUP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- PDF GENERATION FOR EMAILED CLEARANCE REPORTS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        /* Custom Scrollbar for a cleaner look */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @media print {
            @page {
                margin: 5mm;
            }
            
            /* RESET EVERYTHING FOR PRINT */
            html, body {
                height: auto !important;
                overflow: visible !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                background: white !important;
                color: black !important;
            }

            /* Disable Fixed Positioning on Modals for Multi-page Print */
            .fixed, .absolute, .relative, .inset-0, .h-\[90vh\], .overflow-y-auto, .overflow-auto {
                position: static !important;
                overflow: visible !important;
                height: auto !important;
                width: auto !important;
                max-height: none !important;
            }

            /* HIDE EVERYTHING... */
            body * {
                visibility: hidden;
            }

            /* ...EXCEPT THE PRINT AREA */
            #printableArea, #printableArea * {
                visibility: visible;
            }

            /* POSITION THE PRINT AREA */
            #printableArea {
                position: absolute !important;
                left: 0;
                top: 0;
                width: 100% !important;
                height: auto !important; 
                margin: 0;
                padding: 0;
                background: white;
                font-family: 'Arial', sans-serif;
                font-size: 9px; 
                color: black;
                z-index: 9999;
                overflow: visible !important;
                display: block !important;
            }
            
            .no-print { display: none !important; }

            /* Force display for print headers even if hidden on screen */
            .print-only-header {
                display: block !important;
                visibility: visible !important;
            }
            
            /* TABLE STYLING FOR PRINT */
            table { 
                width: 100% !important; 
                border-collapse: collapse; 
            }
            
            thead { display: table-header-group; }
            tfoot { display: table-footer-group; }
            tr { page-break-inside: avoid; }

            th, td { 
                border: 1px solid #000 !important; 
                padding: 2px 3px !important; 
                overflow: hidden;
                white-space: normal; /* Allow wrapping */
                vertical-align: middle;
            }
            
            /* --- CLEARANCE REPORT SPECIFIC (13 Columns) --- */
            .clearance-table { table-layout: fixed; }
            .clearance-table th:nth-child(1), .clearance-table td:nth-child(1) { width: 14%; } /* Sem */
            .clearance-table th:nth-child(2), .clearance-table td:nth-child(2) { width: 4%; text-align: center; }  /* Sub */
            .clearance-table th:nth-child(3), .clearance-table td:nth-child(3) { width: 4%; text-align: center; }  /* Cr */
            .clearance-table th:nth-child(4), .clearance-table td:nth-child(4) { width: 8%; text-align: right; }  /* Tuition */
            .clearance-table th:nth-child(5), .clearance-table td:nth-child(5) { width: 6%; text-align: right; }  /* Exam */
            .clearance-table th:nth-child(6), .clearance-table td:nth-child(6) { width: 6%; text-align: right; }  /* Reg */
            .clearance-table th:nth-child(7), .clearance-table td:nth-child(7) { width: 6%; text-align: right; }  /* Other */
            .clearance-table th:nth-child(8), .clearance-table td:nth-child(8) { width: 9%; text-align: right; background-color: #f3f4f6 !important; font-weight: bold; } /* Total */
            .clearance-table th:nth-child(9), .clearance-table td:nth-child(9) { width: 5%; text-align: center; }  /* Disc % */
            .clearance-table th:nth-child(10), .clearance-table td:nth-child(10) { width: 7%; text-align: right; } /* D. Amt */
            .clearance-table th:nth-child(11), .clearance-table td:nth-child(11) { width: 9%; text-align: right; font-weight: bold; } /* Net */
            .clearance-table th:nth-child(12), .clearance-table td:nth-child(12) { width: 9%; text-align: right; } /* Paid */
            .clearance-table th:nth-child(13), .clearance-table td:nth-child(13) { width: 13%; text-align: right; font-weight: bold; } /* Balance */
            
            /* --- SESSION DETAIL REPORT SPECIFIC (11 Columns) --- */
            .session-detail-table { table-layout: fixed; }
            .session-detail-table th:nth-child(1), .session-detail-table td:nth-child(1) { width: 4%; text-align: center; } /* # */
            .session-detail-table th:nth-child(2), .session-detail-table td:nth-child(2) { width: 15%; font-family: monospace; } /* Reg No */
            .session-detail-table th:nth-child(3), .session-detail-table td:nth-child(3) { width: 20%; } /* Name */
            .session-detail-table th:nth-child(4), .session-detail-table td:nth-child(4) { width: 5%; text-align: center; } /* Courses */
            .session-detail-table th:nth-child(5), .session-detail-table td:nth-child(5) { width: 4%; text-align: center; } /* Cr */
            .session-detail-table th:nth-child(6), .session-detail-table td:nth-child(6) { width: 8%; text-align: right; } /* Tuition */
            .session-detail-table th:nth-child(7), .session-detail-table td:nth-child(7) { width: 8%; text-align: right; } /* Exam Fee */
            .session-detail-table th:nth-child(8), .session-detail-table td:nth-child(8) { width: 8%; text-align: right; } /* Discount */
            .session-detail-table th:nth-child(9), .session-detail-table td:nth-child(9) { width: 9%; text-align: right; font-weight: bold; } /* Total */
            .session-detail-table th:nth-child(10), .session-detail-table td:nth-child(10) { width: 9%; text-align: right; } /* Paid */
            .session-detail-table th:nth-child(11), .session-detail-table td:nth-child(11) { width: 10%; text-align: right; font-weight: bold; } /* Balance */

            /* Highlight Total */
            .print-modern-total {
                background-color: #000 !important;
                color: #fff !important;
                font-weight: 900 !important;
                border: 2px solid #000 !important;
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact;
            }

            thead th {
                background-color: #e5e7eb !important;
                font-weight: 800;
                text-transform: uppercase;
                font-size: 8px;
                -webkit-print-color-adjust: exact;
            }
            
            /* Force Landscape for Summary Detail if needed */
            .landscape-mode-print {
                 /* @page { size: A4 landscape; } */
            }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 overflow-hidden">
    <div id="root"></div>

    <script type="text/babel" data-presets="react-classic">
        const { useState, useEffect, useMemo } = React;
        const API_URL = 'api.php'; 

        // --- ICONS ---
        const Icon = ({ d, ...props }) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d} /></svg>;
        const Search = (p) => <Icon d="M21 21l-4.35-4.35M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0z" {...p} />;
        const Plus = (p) => <Icon d="M12 5v14M5 12h14" {...p} />;
        const Trash2 = (p) => <Icon d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" {...p} />;
        const FileText = (p) => <Icon d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" {...p} />;
        const Users = (p) => <Icon d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" {...p} />;
        const DollarSign = (p) => <Icon d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" {...p} />;
        const BookOpen = (p) => <Icon d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" {...p} />;
        const CreditCard = (p) => <Icon d="M1 4h22v16H1zM1 10h22" {...p} />;
        const Percent = (p) => <Icon d="M19 5L5 19M6.5 6.5h0M17.5 17.5h0" {...p} />;
        const Printer = (p) => <Icon d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z" {...p} />;
        const Download = (p) => <Icon d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" {...p} />;
        const Upload = (p) => <Icon d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" {...p} />;
        const FileSpreadsheet = (p) => <Icon d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" {...p} />;
        const XSquare = (p) => <Icon d="M3 3h18v18H3zM9 9l6 6M15 9l-6 6" {...p} />;
        const AlertCircle = (p) => <Icon d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" {...p} />;
        const CalendarX = (p) => <Icon d="M3 4h18v18H3zM16 2v4M8 2v4M3 10h18" {...p} />;
        const LogOut = (p) => <Icon d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-12-5-7M21 12H9" {...p} />;
        const Shield = (p) => <Icon d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" {...p} />;
        const Key = (p) => <Icon d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4" {...p} />;
        const CloudUpload = (p) => <Icon d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19a4 4 0 0 0 4 4h11a4 4 0 0 0 4-4v-2.5" {...p} />;
        const Landmark = (p) => <Icon d="M3 22v-8h18v8M12 2L2 7v3h20V7L12 2zM6 10v6M10 10v6M14 10v6M18 10v6" {...p} />;
        const Menu = (p) => <Icon d="M3 12h18M3 6h18M3 18h18" {...p} />;
        const BarChart = (p) => <Icon d="M12 20V10M18 20V4M6 20v-4" {...p} />;
        const Eye = (p) => <Icon d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z M12 5c-3.866 0-7 3.134-7 7s3.134 7 7 7 7-3.134 7-7-3.134-7-7-7z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" {...p} />;
        const RefreshCw = (p) => <Icon d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" {...p} />;
        const Wallet = (p) => <Icon d="M21 12V7H5a2 2 0 0 1 0-4h14v4M3 5v14a2 2 0 0 0 2 2h16v-5M18 12a2 2 0 0 0 0 4h4v-4h-4z" {...p} />;
        const SettingsIcon = (p) => <Icon d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" {...p} />;

        const DEFAULT_MESSAGE_TEMPLATE = "Dear {name},\n\nYour Fee Clearance Report is ready.\n\nRegistration No: {reg_no}\nDegree Program: {degree}\nBatch/Session: {batch}\n\nTotal Scholarship: {scholarship}\nNet Payable: {net_payable}\n\nRegards,\n{from_name}";

        function App() {
            // --- STATE & HELPER FUNCTIONS ---
            const norm = (str) => str ? str.toString().toLowerCase().replace(/[^a-z0-9]/g, '') : '';
            const num = (n) => parseFloat(n || 0).toLocaleString('en-US');
            
            const getTermRank = (sem) => {
                const s = (sem || '').toLowerCase();
                if(s.includes('fall')) return 1;
                if(s.includes('spring')) return 2;
                if(s.includes('summer')) return 3;
                return 4;
            };

            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('clearance');
            const [isFetching, setIsFetching] = useState(false);
            
            const TAB_TABLES = new Set(['students', 'fees', 'enrollments', 'payments', 'loans', 'discounts', 'others', 'banks', 'users']);

            const [meta, setMeta] = useState({ fees: [], banks: [], sessions: [], counts: {}, users: [] });
            const [tableRows, setTableRows] = useState([]);
            const [tableTotal, setTableTotal] = useState(0);
            const [tableStats, setTableStats] = useState(null);
            const [loanSemesterStats, setLoanSemesterStats] = useState([]);
            const [summaryData, setSummaryData] = useState([]);
            const [summaryLoading, setSummaryLoading] = useState(false);
            const [clearanceLoading, setClearanceLoading] = useState(false);

            // Lightweight compatibility object for code that still reads data.fees / data.banks
            const data = useMemo(() => ({
                fees: meta.fees || [],
                banks: meta.banks || [],
                users: meta.users || [],
                students: activeTab === 'students' ? tableRows : [],
                enrollments: activeTab === 'enrollments' ? tableRows : [],
                payments: activeTab === 'payments' || activeTab === 'loans' ? tableRows : [],
                discounts: activeTab === 'discounts' ? tableRows : [],
                others: activeTab === 'others' ? tableRows : [],
            }), [meta, tableRows, activeTab]);

            const [searchReg, setSearchReg] = useState('');
            const [filterSession, setFilterSession] = useState(''); 
            const [summaryFilterSession, setSummaryFilterSession] = useState(''); 
            const [tabSearch, setTabSearch] = useState('');
            const [debouncedTabSearch, setDebouncedTabSearch] = useState('');
            const [selectedIds, setSelectedIds] = useState(new Set());
            const [clearanceResult, setClearanceResult] = useState(null);
            
            // PAGINATION
            const [currentPage, setCurrentPage] = useState(1);
            const ITEMS_PER_PAGE = 100;

            const [showModal, setShowModal] = useState(false);
            const [modalType, setModalType] = useState('');
            const [editingId, setEditingId] = useState(null);
            const [formData, setFormData] = useState({});
            const [loginData, setLoginData] = useState({ username: '', password: '' });
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [passwordData, setPasswordData] = useState({ current: '', new: '', confirm: '' });
            
            const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });
            const [importPreview, setImportPreview] = useState({ show: false, total: 0, newItems: [], duplicates: [], updates: [], type: '' });
            const [uploadStatus, setUploadStatus] = useState({ active: false, current: 0, total: 0 });
            const [importTerm, setImportTerm] = useState('');
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [sessionDetail, setSessionDetail] = useState(null);
            const [printOrientation, setPrintOrientation] = useState(() => localStorage.getItem('clearancePrintOrientation') || 'portrait');
            const [loanDateFrom, setLoanDateFrom] = useState('');
            const [loanDateTo, setLoanDateTo] = useState('');
            const [settingsForm, setSettingsForm] = useState(null);
            const [settingsSaving, setSettingsSaving] = useState(false);
            const [sendPanel, setSendPanel] = useState(null); // { channel, recipient } or null
            const [sendBusy, setSendBusy] = useState(false);

            const TABS = [
                { id: 'clearance', label: 'Clearance', icon: FileText },
                { id: 'summary', label: 'Summary', icon: BarChart }, 
                { id: 'students', label: 'Students', icon: Users },
                { id: 'fees', label: 'Fee Structure', icon: DollarSign },
                { id: 'others', label: 'Other Charges', icon: AlertCircle },
                { id: 'enrollments', label: 'Enrollments', icon: BookOpen },
                { id: 'payments', label: 'Payments', icon: CreditCard },
                { id: 'loans', label: 'Other Bank', icon: Wallet },
                { id: 'discounts', label: 'Discounts', icon: Percent },
                { id: 'banks', label: 'Banks', icon: Landmark } 
            ];

            const availableTabs = user ? (
                user.role === 'admin'
                ? [...TABS, { id: 'users', label: 'Users & Access', icon: Shield }, { id: 'settings', label: 'Settings', icon: SettingsIcon }]
                : TABS.filter(t => (user.permissions || []).includes(t.id))
            ) : [];

            // Load reference data (fees, banks, sessions, counts) — small payload
            const loadMeta = async () => {
                try {
                    const res = await fetch(API_URL, { credentials: 'same-origin' });
                    if (res.status === 401) {
                        setUser(null);
                        sessionStorage.removeItem('feeUser');
                        return false;
                    }
                    const json = await res.json();
                    if (json.status === 'error') {
                        alert(json.message || 'Failed to load data');
                        return false;
                    }
                    setMeta({
                        fees: Array.isArray(json.fees) ? json.fees : [],
                        banks: Array.isArray(json.banks) ? json.banks : [],
                        sessions: Array.isArray(json.sessions) ? json.sessions : [],
                        counts: json.counts || {},
                        users: Array.isArray(json.users) ? json.users : [],
                    });
                    return true;
                } catch (e) {
                    console.error('Connection Error:', e);
                    return false;
                }
            };

            // Paginated table fetch — only loads the current tab's page from the server
            const loadTablePage = async (tab = activeTab, page = currentPage, opts = {}) => {
                if (!TAB_TABLES.has(tab)) return;
                const search = opts.search ?? debouncedTabSearch;
                const sortKey = opts.sortKey ?? sortConfig.key;
                const sortDir = opts.sortDir ?? sortConfig.direction;
                const dateFrom = opts.dateFrom ?? loanDateFrom;
                const dateTo = opts.dateTo ?? loanDateTo;
                setIsFetching(true);
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'fetch_table',
                            data: {
                                table: tab,
                                page,
                                limit: ITEMS_PER_PAGE,
                                search,
                                sortKey: sortKey || 'id',
                                sortDir: sortDir || 'desc',
                                dateFrom,
                                dateTo,
                            },
                        }),
                    });
                    if (res.status === 401) {
                        setUser(null);
                        sessionStorage.removeItem('feeUser');
                        return;
                    }
                    const json = await res.json();
                    if (json.status === 'success') {
                        setTableRows(json.rows || []);
                        setTableTotal(json.total || 0);
                        setTableStats(json.stats || null);
                        setLoanSemesterStats(json.loanSemesterStats || []);
                    } else {
                        alert(json.message || 'Failed to load records');
                    }
                } catch (e) {
                    console.error('Table load error:', e);
                } finally {
                    setIsFetching(false);
                }
            };

            const loadSummary = async (filter = summaryFilterSession) => {
                setSummaryLoading(true);
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'get_summary', data: { filter_session: filter } }),
                    });
                    const json = await res.json();
                    if (json.status === 'success') setSummaryData(json.summary || []);
                    else alert(json.message || 'Failed to load summary');
                } catch (e) {
                    alert('Network Error');
                } finally {
                    setSummaryLoading(false);
                }
            };

            const refreshData = async () => {
                await loadMeta();
                if (activeTab === 'summary') await loadSummary();
                else if (TAB_TABLES.has(activeTab)) await loadTablePage(activeTab, currentPage);
            };

            useEffect(() => {
                let styleTag = document.getElementById('dynamic-print-orientation');
                if (!styleTag) {
                    styleTag = document.createElement('style');
                    styleTag.id = 'dynamic-print-orientation';
                    document.head.appendChild(styleTag);
                }
                styleTag.innerHTML = `@media print { @page { size: A4 ${printOrientation}; } }`;
                try {
                    localStorage.setItem('clearancePrintOrientation', printOrientation);
                } catch (e) {
                    console.warn("Could not save print orientation preference:", e);
                }
            }, [printOrientation]);

            useEffect(() => {
                const storedUser = sessionStorage.getItem('feeUser');
                if (storedUser) {
                    try {
                        const parsedUser = JSON.parse(storedUser);
                        if (parsedUser && typeof parsedUser === 'object' && parsedUser.role && Array.isArray(parsedUser.permissions)) {
                            setUser(parsedUser);
                        } else {
                            sessionStorage.removeItem('feeUser');
                        }
                    } catch (e) {
                        sessionStorage.removeItem('feeUser');
                    }
                }
            }, []);

            useEffect(() => {
                if (!user) return;
                loadMeta();
            }, [user]);

            useEffect(() => {
                const timer = setTimeout(() => setDebouncedTabSearch(tabSearch), 350);
                return () => clearTimeout(timer);
            }, [tabSearch]);

            const generateClearancePdfBase64 = async () => {
                const element = document.getElementById('printableArea');
                const canvas = await window.html2canvas(element, { scale: 2, useCORS: true });
                const imgData = canvas.toDataURL('image/jpeg', 0.92);
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ orientation: printOrientation, unit: 'mm', format: 'a4' });
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                const imgWidth = pageWidth;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;

                let heightLeft = imgHeight;
                let position = 0;
                pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
                heightLeft -= pageHeight;

                while (heightLeft > 0) {
                    position -= pageHeight;
                    pdf.addPage();
                    pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
                    heightLeft -= pageHeight;
                }

                return pdf.output('datauristring').split(',')[1];
            };

            // --- IMPORT HANDLER (OPTIMIZED) ---
            const handleImport = (e, type) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    const text = evt.target.result;
                    const rows = text.split('\n').map(r => r.trim()).filter(r => r);
                    if (rows.length < 2) return; 
                    const headers = rows[0].split(',').map(h => h.trim().replace(/ /g, '_').toLowerCase());

                    let existingData = [];
                    const studentNameMap = new Map();
                    try {
                        const indexRes = await fetch(API_URL, {
                            method: 'POST', credentials: 'same-origin',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'get_import_index', data: { type } }),
                        });
                        const indexJson = await indexRes.json();
                        if (indexJson.status === 'success') existingData = indexJson.rows || [];
                        if (type !== 'students') {
                            const stRes = await fetch(API_URL, {
                                method: 'POST', credentials: 'same-origin',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ action: 'get_import_index', data: { type: 'students' } }),
                            });
                            const stJson = await stRes.json();
                            (stJson.rows || []).forEach(s => studentNameMap.set(norm(s.reg_no), s.name));
                        }
                    } catch (e) {
                        return alert('Could not load existing records for duplicate check');
                    }

                    const newItems = [];
                    const duplicates = [];
                    const updates = [];
                    
                    for (let i = 1; i < rows.length; i++) {
                        const values = rows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                        const obj = {};
                        
                        headers.forEach((h, index) => {
                            let val = values[index] ? values[index].trim() : '';
                            if (val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1);
                            
                            if (h.includes('reg') && h.includes('no')) obj['reg_no'] = val;
                            else if ((h.includes('fee') || h.includes('charge') || h.includes('head')) && (h.includes('name') || h.includes('head'))) obj['fee_name'] = val; 
                            else if (h.includes('name') && !h.includes('user') && !h.includes('fee') && !h.includes('head')) obj['name'] = val; 
                            else if (h.includes('semester')) obj['semester'] = val;
                            else if (h.includes('amount')) obj['amount'] = val;
                            else if (h === 'cr') obj['cr'] = val;
                            else if (h.includes('course')) obj['courses'] = val;
                            else if (h.includes('degree')) obj['degree'] = val;
                            else if (h.includes('batch')) obj['batch'] = val;
                            else if (h.includes('term')) obj['term'] = val;
                            else if (h.includes('fee') && h.includes('name')) obj['fee_name'] = val;
                            else if (h.includes('bank')) obj['bank'] = val;
                            else if (h.includes('mobile')) obj['mobile'] = val;
                            else if (h.includes('email')) obj['email'] = val;
                            else if (h.includes('package') || h.includes('total_package')) obj['total_package'] = val; 
                            else obj[h] = val; 
                        });

                        if(importTerm) {
                            if(type === 'enrollments' || type === 'payments' || type === 'others' || type === 'loans') obj.semester = importTerm;
                            else if(type === 'discounts') obj.term = importTerm;
                        }
                        if (obj.amount) obj.amount = obj.amount.replace(/[^0-9.-]/g, '');

                        if (type === 'students' && obj.reg_no) {
                             const upper = obj.reg_no.toUpperCase();
                             if (upper.includes('05')) {
                                 obj.degree = upper.split('05')[0];
                             }
                        }

                        if (!obj.name && obj.reg_no) {
                            const studentName = studentNameMap.get(norm(obj.reg_no));
                            if (studentName) obj.name = studentName;
                        }

                        if (type === 'students') {
                            // A matching reg_no is treated as an update (merge onto the existing
                            // student), not a skipped duplicate — this table only ever has one
                            // row per reg_no, so re-appearing in a CSV almost always means the
                            // admin is filling in mobile/email/total_package for that student.
                            const existingStudent = existingData.find(existing => norm(existing.reg_no) === norm(obj.reg_no));
                            if (existingStudent) {
                                // Blank cells shouldn't clear existing fields — only overwrite with non-empty values
                                const nonEmpty = Object.fromEntries(Object.entries(obj).filter(([, v]) => v !== '' && v != null));
                                updates.push({ ...existingStudent, ...nonEmpty });
                            } else {
                                newItems.push(obj);
                            }
                            continue;
                        }

                        let isDuplicate = false;
                        if (type === 'payments') {
                             isDuplicate = existingData.some(existing =>
                                norm(existing.reg_no) === norm(obj.reg_no) &&
                                Math.abs(parseFloat(existing.amount || 0) - parseFloat(obj.amount || 0)) < 0.01 &&
                                existing.date === obj.date &&
                                norm(existing.bank) === norm(obj.bank)
                            );
                        } else if (type === 'loans') {
                             isDuplicate = existingData.some(existing =>
                                norm(existing.reg_no) === norm(obj.reg_no) &&
                                Math.abs(parseFloat(existing.amount || 0) - parseFloat(obj.amount || 0)) < 0.01 &&
                                existing.date === obj.date
                            );
                        } else if (type === 'fees') {
                             isDuplicate = existingData.some(existing => norm(existing.degree) === norm(obj.degree) && norm(existing.batch) === norm(obj.batch));
                        } else {
                             isDuplicate = existingData.some(existing => 
                                norm(existing.reg_no) === norm(obj.reg_no) &&
                                ((existing.semester && norm(existing.semester) === norm(obj.semester)) ||
                                (existing.term && norm(existing.term) === norm(obj.term)))
                             );
                        }
                        
                        if (isDuplicate) duplicates.push(obj);
                        else newItems.push(obj);
                    }
                    
                    setImportPreview({ show: true, total: rows.length - 1, newItems, duplicates, updates, type });
                    e.target.value = null;
                };
                reader.readAsText(file);
            };

            const confirmImport = async () => {
                const toSave = [...importPreview.newItems, ...(importPreview.updates || [])];
                setUploadStatus({ active: true, current: 0, total: toSave.length });
                let actionType = importPreview.type.slice(0, -1);
                if(importPreview.type === 'others') actionType = 'other';
                if(importPreview.type === 'loans') actionType = 'payment';
                let uploadedCount = 0;

                const chunkSize = 25; // Send 25 requests concurrently
                for (let i = 0; i < toSave.length; i += chunkSize) {
                    const chunk = toSave.slice(i, i + chunkSize);
                    await Promise.all(chunk.map(async (item) => {
                        const payload = importPreview.type === 'loans' ? { ...item, bank: 'Loan' } : item;
                        await postToApi(`save_${actionType}`, { data: payload }, true); // Skip refresh for speed
                    }));
                    uploadedCount += chunk.length;
                    if (uploadedCount > toSave.length) uploadedCount = toSave.length;
                    setUploadStatus(prev => ({ ...prev, current: uploadedCount }));
                }

                setImportPreview({ show: false, total: 0, newItems: [], duplicates: [], updates: [], type: '' });
                setUploadStatus({ active: false, current: 0, total: 0 });
                alert(`Successfully imported ${uploadedCount} records!`);
                refreshData();

            const handleSelectAll = (e) => {

                let idsToDelete = selectedIds;
                if (activeTab === 'payments') {
                    const loanIds = new Set(tableRows.filter(p => selectedIds.has(p.id) && norm(p.bank) === 'loan').map(p => p.id));
                    if (loanIds.size > 0) {
                        alert(`${loanIds.size} selected record(s) are loan-sourced payments and were skipped. Delete them from the "Other Bank" tab instead.`);
                        idsToDelete = new Set([...selectedIds].filter(id => !loanIds.has(id)));
                    }
                }
                if (idsToDelete.size === 0) { setSelectedIds(new Set()); return; }
                if (!confirm(`Delete ${idsToDelete.size} records?`)) return;

                for (let id of idsToDelete) {
                    let type = activeTab;
                    if(type === 'others') type = 'other';
                    if(type === 'loans') type = 'payments';
                    await postToApi(`delete_${type.slice(0,-1)}`, { id }, true);

                    setTableRows([]);

                    loadMeta();

                const term = prompt("Enter Semester Name to delete:");
                if (!term) return;

                if (perms.includes(tabId)) setFormData({ ...formData, permissions: perms.filter(p => p !== tabId) });
                else setFormData({ ...formData, permissions: [...perms, tabId] });
            };
            
            const getHeaders = (type) => {
                switch(type) {
                    case 'students': return ['reg_no', 'name', 'degree', 'batch', 'mobile', 'email', 'total_package'];
                    case 'fees': return ['degree', 'batch', 'per_cr_fee', 'per_course_fee', 'reg_fee', 'other_fee'];
                    case 'enrollments': return ['reg_no', 'name', 'semester', 'cr', 'courses'];
                    case 'payments': return ['reg_no', 'name', 'semester', 'amount', 'date', 'bank'];
                    case 'loans': return ['reg_no', 'name', 'semester', 'amount', 'date'];
                    case 'discounts': return ['reg_no', 'name', 'term', 'discount'];
                    case 'others': return ['reg_no', 'name', 'semester', 'fee_name', 'amount']; 
                    case 'users': return ['username', 'password', 'role', 'permissions']; 
                    case 'banks': return ['name', 'account_no'];
                    default: return [];

            const downloadSample = (type) => {
                const headers = getHeaders(type);
                const displayHeaders = headers.map(h => h === 'fee_name' ? 'fee_head' : h); 
                const csvContent = "data:text/csv;charset=utf-8," + displayHeaders.join(",");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `${type}_sample.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleExport = async (type) => {
                let records = [];
                if (type === activeTab) {
                    records = filteredData;
                } else {
                    try {
                        const res = await fetch(API_URL, {
                            method: 'POST', credentials: 'same-origin',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                action: 'fetch_table',
                                data: { table: type, page: 1, limit: 50000, search: '', sortKey: 'id', sortDir: 'desc' },
                            }),
                        });
                        const json = await res.json();
                        if (json.status === 'success') records = json.rows || [];
                    } catch (e) {
                        return alert('Export failed');
                    }

                if (!records || records.length === 0) return alert("No data to export");
                let headers = getHeaders(type);
                let displayHeaders = headers.map(h => h === 'fee_name' ? 'fee_head' : h);

                const csvRows = [
                    displayHeaders.join(','),
                    ...records.map(row => headers.map(fieldName => {
                        let val = row[fieldName];
                        if (Array.isArray(val)) val = val.join('|'); 
                        val = String(val || '');
                        if (val.search(/("|,|\n)/g) >= 0) {
                            val = `"${val.replace(/"/g, '""')}"`;
                        }
                        return val;
                    }).join(','))
                ];
                
                const csvString = csvRows.join("\n");
                
                const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                if (link.download !== undefined) {
                    const url = URL.createObjectURL(blob);
                    link.setAttribute("href", url);

                    link.click();

                                                <div key={i} className="flex justify-between border-b border-gray-200 last:border-0 pb-1">
                                                    <span>{d.reg_no || 'Unknown'} — {d.name}</span>
                                                    <span className="text-xs bg-gray-200 px-2 rounded text-gray-500">{[d.mobile, d.email, d.total_package].filter(Boolean).join(' / ') || 'no change'}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {importPreview.duplicates.length > 0 && (
                                    <div className="flex-1 overflow-hidden flex flex-col">
                                        <h4 className="font-bold text-sm text-gray-700 mb-2">Duplicate Entries:</h4>
                                        <div className="overflow-y-auto border rounded bg-gray-50 p-2 text-sm text-gray-600 space-y-1">
                                            {importPreview.duplicates.map((d, i) => (
                                                <div key={i} className="flex justify-between border-b border-gray-200 last:border-0 pb-1">
                                                    <span>{d.reg_no || d.name || 'Unknown'}</span>
                                                    <span className="text-xs bg-gray-200 px-2 rounded text-gray-500">{d.semester || d.term || 'N/A'}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="flex justify-end gap-3 mt-6 pt-4 border-t">
                                    <button onClick={() => { setImportPreview({show:false, newItems:[], duplicates:[], updates:[], total:0, type:''}); }} className="px-4 py-2 bg-gray-100 rounded font-bold hover:bg-gray-200">Cancel</button>
                                    {(importPreview.newItems.length + (importPreview.updates || []).length) > 0 && <button onClick={confirmImport} className="px-6 py-2 bg-blue-600 text-white rounded font-bold hover:bg-blue-700">Import {importPreview.newItems.length + (importPreview.updates || []).length} Records</button>}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, errorMessage: '' };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, errorMessage: (error && error.message) || String(error) };
            }
            componentDidCatch(error, info) {
                console.error("App crashed:", error, info);
            }
            handleReset = () => {
                sessionStorage.clear();
                localStorage.clear();
                window.location.reload();
            };
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-gray-900 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-md p-8 text-center">
                                <h2 className="text-xl font-bold text-gray-800 mb-2">Something went wrong</h2>
                                <p className="text-gray-500 mb-4 text-sm">The app hit an unexpected error while loading. Resetting your locally cached data usually fixes this.</p>
                                {this.state.errorMessage && <p className="text-xs font-mono bg-gray-100 text-gray-600 p-2 rounded mb-6 break-words text-left">{this.state.errorMessage}</p>}
                                <button onClick={this.handleReset} className="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-bold transition">Reset & Reload</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
